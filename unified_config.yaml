    gender: "male"
  - realname: "Bruno Mars"
    username: "BrunoMars"
    gender: "male"
  - realname: "Niall Horan"
    username: "NiallOfficial"
    gender: "male"
  - realname: "Rihanna"
    username: "rihanna"
    gender: "female"
  - realname: "Katy Perry"
    username: "katyperry"
    gender: "female"
  - realname: "Taylor Swift"
    username: "taylorswift13"
