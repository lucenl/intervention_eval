# Experiment configuration


celebrities:
  - realname: "Justin Bieber"
    username: "justinbieber"
    gender: "male"
  - realname: "Justin Timberlake"
    username: "jtimberlake"
    gender: "male"
  - realname: "LeBron James"
    username: "KingJames"
    gender: "male"
  - realname: "Bruno Mars"
    username: "BrunoMars"
    gender: "male"
  - realname: "Niall Horan"
    username: "NiallOfficial"
    gender: "male"
  - realname: "Rihanna"
    username: "rihanna"
    gender: "female"
  - realname: "Katy Perry"
    username: "katyperry"
    gender: "female"
  - realname: "Taylor Swift"
    username: "taylorswift13"
    gender: "female"
  - realname: "Lady Gaga"
    username: "ladygaga"
    gender: "female"
  - realname: "Kim Kardashian"
    username: "KimKardashian"
    gender: "female"

model:
  type: "gpt-4o-mini"
  temperature: 0.7

data:
  db_path: "./database/preloaded_data.db"

simulation:
  activate_prob: 1            # Probability each agent is active per timestep
  num_timesteps: 20           # Total simulation steps

# Twitter settings
twitter:
  refresh_rec_post_count: 40
  max_rec_post_len: 40
  political_ratio: 0.1      # Ratio of political posts in recommendations

# OpenAI API limits; set these to your account's limits
api:
  max_concurrent: 100         # Maximum number of requests in flight
  requests_per_minute: 500    # Maximum number of requests started per minute
  price_per_1m_input: null    # Optional: USD per 1M input tokens, enables the Cost column
  price_per_1m_output: null   # Optional: USD per 1M output tokens
